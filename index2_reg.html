<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account sign in Starbucks Cofee Company</title>
    <link rel="stylesheet" href="style2.css">
</head>
<header>
        <img src="logo_for_reg-edited-free (carve_photos)-edited-free (carve.photos).png" alt="" class="logo">
</header>
<body>
    <h2>Sign in or create an account</h2>
    <section class="card">
        <div class="suka">
                <div id="hz">* indicates required field</div>
            <div class="usn">
                <input type="email" placeholder="* Username or email adress">
            </div>
            <div class="password">
                <input type="password" placeholder="* Password" >
            </div>
            <div id="label">
                <label>
                    <input type="checkbox" name="option1" unchecked>
                    Keep me signed in.
                </label>
                <a href="">Details</a>
            </div>
            <div class="forgot">
                <a href="">Forgot your username?</a>
                <a href="">Forgot your password?</a>
            </div>
            <button>Sign in</button>
        </div>
    </section>
</body>
